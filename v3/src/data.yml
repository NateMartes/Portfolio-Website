projects_ui:
  command: ranger /home/nate/projects
  root: /home/nate
  items:
    - name: "Lotlytics"
      description: "Lotlytics is a cloud-native parking-intelligence platform. Edge devices count vehicles in real time; the web app shows live availability and turn-by-turn directions so drivers can plan trips and skip the circling. Works for Google Maps, Apple Maps, and Waze."
      url: "https://github.com/NateMartes/Lotlytics"
      skills: ["Java", "Python", "TypeScript", "NextJS", "OpenCV", "AWS", "Vercel", "Spring Boot", "PostgreSQL", "DynamoDB"]
    - name: "Self Quest (Lehigh Hacks 2025)"
      description: "Created a serverless full stack application using JavaScript, React, HTML, Tailwind CSS, Python, Git, and DynamoDB that creates AI interactive narrative chapters for therapy and user resonance which placed 1st with best use of AWS resources among 200+ participants at Lehigh University."
      url: "https://devpost.com/software/selfquest-4mp2d3"
      skills: ["AI", "Python", "JavaScript", "FastAPI", "AWS", "Git", "REST"]
    - name: "Crown of the Abyss"
      description: "Created A 4-player turn-based dungeon crawler using microservices. Built with Pygame, FastAPI, and SQLite. Designed microservice architecture which features a RESTful API and Websockets for connection between players. Deployed CI/CD pipelines with GitLab, Docker, and Pytest to lint, test, and deploy microservices."
      url: "https://github.com/NateMartes/crown-of-the-abyss-v2"
      skills: ["Python", "SQLite", "FastAPI", "Docker", "Git"]
    - name: "RoomReady (HenHacks 2025)"
      description: "The app takes user uploaded images about a room they are interested for preparing for natural disasters. Then we use selective prompting and generative AI on the received image to give back a risk analysis report, a checklist, and a list of improvements."
      url: "https://devpost.com/software/roomready"
      skills: ["Python", "FastAPI", "AI", "TypeScript", "React", "Docker"]
    - name: "Course Scraper"
      description: "Created a parallel web scraper to gather Wilkes University’s course data using Golang, MongoDB, and Docker. Implemented a RESTful API to query a NoSQL database with dynamic query parameters."
      url: "https://github.com/Ichmagkase/WilkesU-Course-Web-Scraper"
      skills: ["Go", "MongoDB", "HTML", "Git", "Docker"]
    - name: "HTTP Server from Scratch"
      description: "Developed a HTTP server using Node.JS, Node.JS's .net library, and TypeScript. Implemented a TCP server with a dynamic buffer to correctly parse HTTP requests and send HTTP responses depending on the corresponding URI."
      url: "https://github.com/NateMartes/HTTP-Server"
      skills: ["NodeJS", "TypeScript", "Git"]
    - name: "CipherX"
      description: "Built a GUI application with a team of 3 that allows users to save, copy, import, and export passwords. All passwords are stored behind a vault password that is hashed using the SHA-256 algorithm."
      url: "https://github.com/NateMartes/CipherX"
      skills: ["Java", "MySQL", "Git"]
    - name: "Recipe Book"
      description: "Utilized Python and the Tkinter Library to create a GUI Recipe Book with a team. Users can view over 50 recipes and add their own. Recipes are stored using JSON."
      skills: ["Python"]
